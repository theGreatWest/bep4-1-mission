spring:
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 개발용 자동 스키마 반영
      # create : 애플리케이션 시작 시 테이블을 모두 삭제하고 새로 생성
      # create-drop : create와 동일하지만, 애플리케이션 종료 시 테이블도 삭제
      # update : 테이블이 없을 때만 생성(== 재시작해도 데이터 유지), 엔티티 변경사항이 있으면 테이블 구조 수정
      # validate : 엔티티와 테이블이 매핑되는지만 검증하고, 변경하지 않음
      # none : JPA가 테이블을 관리하지 않음
    show-sql: true